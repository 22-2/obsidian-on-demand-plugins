name: "Release"

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Already-pushed release tag (e.g. 3.6.2)"
                required: true
                type: string
permissions:
    contents: write
    id-token: write
    attestations: write

concurrency:
    group: release-${{ inputs.version }}
    cancel-in-progress: false

jobs:
    release:
        # Versions and tags are created locally; this workflow only builds and publishes them.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        env:
            RELEASE_VERSION: ${{ inputs.version }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Validate release tag
              run: |
                  [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            - uses: actions/checkout@v6
              with:
                  ref: refs/tags/${{ inputs.version }}
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: "24.15.0"
            - uses: pnpm/action-setup@v5
              with:
                  version: 10
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - name: Verify release assets
              run: pnpm run verify-build "$RELEASE_VERSION"
            - uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      styles.css
                      manifest.json
            - name: Publish release
              # Create the release once so reruns cannot overwrite an existing published release.
              run: |
                  node scripts/release-notes.mjs "$RELEASE_VERSION" > release-notes.md
                  gh release create "$RELEASE_VERSION" main.js styles.css manifest.json \
                    --verify-tag --title "$RELEASE_VERSION" --notes-file release-notes.md
