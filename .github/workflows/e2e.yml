name: E2E Tests

on:
    # Branch pushes are covered by pull_request; push only runs for main to avoid duplicate runs.
    push:
        branches: [main]
    pull_request: {}
    workflow_dispatch:
        inputs:
            obsidian_version:
                description: "Obsidian release version (e.g. 1.12.4). Use latest for latest release."
                required: false
                default: "latest"

defaults:
    run:
        shell: bash

# Cancel superseded runs when a PR receives a newer push.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [macos-latest, windows-latest]

        # Share authentication and asset paths so installation and test setup cannot omit them.
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
            OBSIDIAN_E2E_TOOLKIT_HOME: ${{ github.workspace }}
            # versions.json maps plugin compatibility; select the test version from the input or latest.
            OBSIDIAN_E2E_TOOLKIT_OBSIDIAN_VERSION: ${{ github.event.inputs.obsidian_version || 'latest' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: "10"

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24.15.0'
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml

            - name: Cache plugin downloads
              uses: actions/cache@v5
              with:
                  path: myfiles
                  key: ${{ runner.os }}-myfiles-${{ hashFiles('tests/plugin-sources.json') }}
                  restore-keys: |
                      ${{ runner.os }}-myfiles-

            - name: Cache toolkit assets
              uses: actions/cache@v5
              with:
                  path: obsidian-e2e-toolkit-assets
                  key: ${{ runner.os }}-obsidians-e2e-toolkit-v4-${{ env.OBSIDIAN_E2E_TOOLKIT_OBSIDIAN_VERSION }}
                  restore-keys: |
                      ${{ runner.os }}-obsidians-e2e-toolkit-v4-

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v5
              with:
                  path: .cache/ms-playwright
                  key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-playwright-chromium-

            - name: Install dependencies
              run: |
                  git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
                  pnpm install --no-frozen-lockfile

            - name: Verify Electron installation
              # The toolkit declares Electron as a peer dependency, so keep it
              # direct in this project and fail before Playwright if its binary is missing.
              run: pnpm exec electron --version

            - name: Install Playwright chromium
              # Downloads from cdn.playwright.dev can stall after reaching 100% on macOS.
              # Playwright has no overall download timeout, so bound each attempt
              # and retry to prevent the job from hanging.
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              uses: nick-fields/retry@v4
              with:
                  timeout_minutes: 10
                  max_attempts: 3
                  shell: bash
                  command: pnpm exec playwright install chromium

            - name: Build plugin under test
              run: pnpm run build

            - name: Ensure toolkit Obsidian is installed
              run: node node_modules/obsidian-e2e-toolkit/scripts/setup.mjs

            - name: Run E2E tests
              env:
                  CI: true
              run: pnpm run test:e2e

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-${{ matrix.os }}
                  path: playwright-report
