name: E2E Tests

on:
    # Branch pushes are covered by pull_request; push only runs for main to avoid duplicate runs.
    push:
        branches: [main, dev]
    pull_request: {}
    workflow_dispatch:
        inputs:
            obsidian_version:
                description: "Obsidian release version (e.g. 1.12.4). Use latest for latest release."
                required: false
                default: "latest"
    # Run weekly against the newest Obsidian release so internal API breakage surfaces before users report it.
    schedule:
        - cron: "0 0 * * 1"

defaults:
    run:
        shell: bash

# Cancel superseded runs when a PR receives a newer push.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        runs-on: ${{ matrix.os }}
        strategy:
            # Let each OS finish so one platform's failure doesn't hide the other's result.
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]

        # Share authentication and asset paths so installation and test setup cannot omit them.
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
            OBSIDIAN_E2E_TOOLKIT_HOME: ${{ github.workspace }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            # The toolkit reuses cached release metadata when asked for "latest", so a restored
            # cache would pin CI to whichever release was cached first. Resolve a concrete
            # version here so both the cache key and the toolkit follow new releases.
            - name: Resolve Obsidian version
              env:
                  REQUESTED_VERSION: ${{ github.event.inputs.obsidian_version }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version="${REQUESTED_VERSION:-latest}"
                  if [ "$version" = "latest" ]; then
                      # Skip mobile-only releases, which lack the desktop assets the toolkit needs.
                      version=$(gh api repos/obsidianmd/obsidian-releases/releases --jq '[.[] | select(.prerelease | not) | select(any(.assets[]; .name | endswith(".tar.gz")) and any(.assets[]; .name | endswith(".asar.gz")))][0].tag_name')
                  fi
                  if [ -z "$version" ]; then
                      echo "Failed to resolve Obsidian version" >&2
                      exit 1
                  fi
                  echo "Testing against Obsidian ${version#v}"
                  echo "OBSIDIAN_E2E_TOOLKIT_OBSIDIAN_VERSION=${version#v}" >> "$GITHUB_ENV"

            - name: Setup pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: "10"

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24.15.0'
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml

            - name: Cache plugin downloads
              uses: actions/cache@v5
              with:
                  path: myfiles
                  key: ${{ runner.os }}-myfiles-${{ hashFiles('tests/plugin-sources.json') }}
                  restore-keys: |
                      ${{ runner.os }}-myfiles-

            - name: Cache toolkit assets
              uses: actions/cache@v5
              with:
                  path: obsidian-e2e-toolkit-assets
                  key: ${{ runner.os }}-obsidians-e2e-toolkit-v4-${{ env.OBSIDIAN_E2E_TOOLKIT_OBSIDIAN_VERSION }}
                  restore-keys: |
                      ${{ runner.os }}-obsidians-e2e-toolkit-v4-

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v5
              with:
                  path: .cache/ms-playwright
                  key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-playwright-chromium-

            - name: Install dependencies
              run: |
                  git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
                  pnpm install --no-frozen-lockfile

            - name: Verify Electron installation
              # The toolkit declares Electron as a peer dependency, so keep it
              # direct in this project and fail before Playwright if its binary is missing.
              run: pnpm exec electron --version

            - name: Install Playwright chromium
              # Downloads from cdn.playwright.dev can stall after reaching 100% on macOS.
              # Playwright has no overall download timeout, so bound each attempt
              # and retry to prevent the job from hanging.
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              uses: nick-fields/retry@v4
              with:
                  timeout_minutes: 10
                  max_attempts: 3
                  shell: bash
                  command: pnpm exec playwright install chromium

            - name: Build plugin under test
              run: pnpm run build

            - name: Ensure toolkit Obsidian is installed
              run: node node_modules/obsidian-e2e-toolkit/scripts/setup.mjs

            - name: Run E2E tests
              env:
                  CI: true
              run: pnpm run test:e2e

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-${{ matrix.os }}
                  path: playwright-report
